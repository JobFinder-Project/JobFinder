name: "⬆️ Atualização / Upgrade Request"
description: "Solicitação de atualização de dependência, versão ou infraestrutura"
title: "[Upgrade]: "
labels: ["enhancement"]
assignees: []

body:
  - type: checkboxes
    id: impacto
    attributes:
      label: 🔍 Impacto
      description: Marque as partes do projeto que podem ser afetadas.
      options:
        - label: Frontend / Interface
        - label: Backend / API
        - label: Banco de dados
        - label: Autenticação / Sessão
        - label: Upload / Arquivos
        - label: Dependências
        - label: CI-CD / Deploy
        - label: Documentação / Swagger
        - label: Testes

  - type: input
    id: componente
    attributes:
      label: 📦 O que será atualizado?
      description: Especifique o componente, dependência ou infraestrutura.
      placeholder: "Ex: Node.js 20 para 22, React, Express, Mongoose, workflow de CI"
    validations:
      required: true

  - type: textarea
    id: motivo
    attributes:
      label: ❓ Motivo da atualização
      description: Por que essa atualização é necessária?
      placeholder: "Ex: corrigir vulnerabilidade, manter compatibilidade, remover API depreciada ou habilitar melhoria necessária no projeto."
    validations:
      required: true

  - type: textarea
    id: riscos
    attributes:
      label: ⚠️ Riscos
      description: Liste possíveis riscos ao aplicar esse upgrade.
      placeholder: "Ex: quebra no login, criação de vagas, upload de imagens, rotas protegidas ou testes automatizados."
    validations:
      required: false 
        
  - type: textarea
    id: validacao
    attributes:
      label: 🎯 Passos para validação
      description: Explique como verificar que a atualização foi aplicada corretamente.
      placeholder: "Ex: - [ ] A empresa consegue salvar uma vaga como rascunho\n- [ ] A vaga em rascunho não aparece para candidatos\n- [ ] A empresa consegue publicar o rascunho depois"
    validations:
      required: true
